<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Stylized Christmas Tree</title>
  <style>
    :root {
      --bg-color: #0f1015;
      --card-bg: #161821;
      --card-border: #262938;
      --text-main: #f0f2f8;
      --text-sub: #8d93a5;
      --accent-blue: #3b82f6;
      --accent-hover: #2563eb;
      --input-bg: #1c1f2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .viewport-card {
      position: relative;
      width: 100%;
      height: 480px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    .hint-badge {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(10, 11, 16, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-sub);
      pointer-events: none;
    }

    .controls-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px 32px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
    }

    @media (max-width: 640px) {
      .controls-card {
        grid-template-columns: 1fr;
      }
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .control-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .control-value {
      font-size: 0.9rem;
      font-family: monospace;
      color: var(--text-sub);
    }

    select {
      width: 100%;
      padding: 10px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    select:hover {
      border-color: #3b3f54;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: var(--input-bg);
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--accent-blue);
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: var(--accent-hover);
      transform: scale(1.1);
    }
  </style>

  <!-- Import Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>3D Stylized Christmas Tree</h1>
      <p>Customize geometry, lighting, and ornaments in real time</p>
    </div>

    <div class="viewport-card">
      <div id="canvas-container"></div>
      <div class="hint-badge">Drag to rotate • Scroll to zoom • Click items</div>
    </div>

    <div class="controls-card">
      <div class="control-group">
        <div class="control-header">
          <label class="control-label" for="paletteSelect">Color Palette</label>
        </div>
        <select id="paletteSelect">
          <option value="classic">Classic Evergreen</option>
          <option value="frost">Winter Frost</option>
          <option value="golden">Golden Luxe</option>
          <option value="neon">Cyber Neon</option>
        </select>
      </div>

      <div class="control-group">
        <div class="control-header">
          <label class="control-label" for="ornamentSlider">Ornaments</label>
          <span class="control-value" id="ornamentVal">60</span>
        </div>
        <input type="range" id="ornamentSlider" min="10" max="120" value="60">
      </div>

      <div class="control-group">
        <div class="control-header">
          <label class="control-label" for="lightSlider">Light Intensity</label>
          <span class="control-value" id="lightVal">1.1</span>
        </div>
        <input type="range" id="lightSlider" min="0.2" max="3.0" step="0.1" value="1.1">
      </div>

      <div class="control-group">
        <div class="control-header">
          <label class="control-label" for="spinSlider">Spin Speed</label>
          <span class="control-value" id="spinVal">0.5</span>
        </div>
        <input type="range" id="spinSlider" min="0.0" max="2.0" step="0.1" value="0.5">
      </div>
    </div>
  </div>

  <script>
    // --- COLOR PALETTES ---
    const PALETTES = {
      classic: {
        foliage: [0x2d6a4f, 0x40916c, 0x52b788],
        trunk: 0x5c3d2e,
        ornaments: [0xe63946, 0xffb703, 0x219ebc, 0xf1faee],
        star: 0xffd700
      },
      frost: {
        foliage: [0x8ecae6, 0x219ebc, 0x023047],
        trunk: 0x3d405b,
        ornaments: [0xffb703, 0xfb8500, 0xe0aaff, 0xffffff],
        star: 0xe0aaff
      },
      golden: {
        foliage: [0x3a3025, 0x4a3f31, 0x5c4f3d],
        trunk: 0x2b1e16,
        ornaments: [0xd4af37, 0xf3e5ab, 0xaa7c11, 0xfff8dc],
        star: 0xffd700
      },
      neon: {
        foliage: [0x10002b, 0x240046, 0x3c096c],
        trunk: 0x150016,
        ornaments: [0xff007f, 0x00f5d4, 0x7b2cbf, 0xffee00],
        star: 0x00f5d4
      }
    };

    let currentPalette = PALETTES.classic;

    // --- SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x161821);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 5, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't clip through floor
    controls.minDistance = 5;
    controls.maxDistance = 20;

    // --- LIGHTS ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xfff5ea, 1.1);
    mainLight.position.set(6, 12, 8);
    mainLight.castShadow = true;
    mainLight.shadow.mapSize.width = 1024;
    mainLight.shadow.mapSize.height = 1024;
    scene.add(mainLight);

    const fillLight = new THREE.PointLight(0x3b82f6, 0.5, 20);
    fillLight.position.set(-6, 3, -6);
    scene.add(fillLight);

    // --- TREE GROUP & OBJECTS ---
    const treeGroup = new THREE.Group();
    scene.add(treeGroup);

    let foliageMaterials = [];
    let trunkMaterial;
    let starMaterial;
    let ornamentsGroup = new THREE.Group();
    treeGroup.add(ornamentsGroup);

    // Grid Floor
    const gridHelper = new THREE.GridHelper(10, 20, 0x3b82f6, 0x262938);
    gridHelper.position.y = -0.01;
    scene.add(gridHelper);

    // Base Platform
    const baseGeo = new THREE.CylinderGeometry(3.5, 3.7, 0.2, 32);
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x11131c, roughness: 0.8 });
    const baseMesh = new THREE.Mesh(baseGeo, baseMat);
    baseMesh.position.y = -0.1;
    baseMesh.receiveShadow = true;
    scene.add(baseMesh);

    // Build Trunk
    function createTrunk() {
      const trunkGeo = new THREE.CylinderGeometry(0.3, 0.45, 1.2, 8);
      trunkMaterial = new THREE.MeshStandardMaterial({
        color: currentPalette.trunk,
        roughness: 0.9,
        flatShading: true
      });
      const trunk = new THREE.Mesh(trunkGeo, trunkMaterial);
      trunk.position.y = 0.6;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      treeGroup.add(trunk);
    }

    // Build Foliage Tiers
    function createFoliage() {
      const tiers = [
        { radius: 2.2, height: 1.8, y: 1.6, segs: 10 },
        { radius: 1.7, height: 1.6, y: 2.7, segs: 9 },
        { radius: 1.2, height: 1.4, y: 3.7, segs: 8 },
        { radius: 0.7, height: 1.1, y: 4.6, segs: 7 }
      ];

      foliageMaterials = [];

      tiers.forEach((tier, idx) => {
        const geo = new THREE.ConeGeometry(tier.radius, tier.height, tier.segs);
        const mat = new THREE.MeshStandardMaterial({
          color: currentPalette.foliage[idx % currentPalette.foliage.length],
          roughness: 0.6,
          flatShading: true
        });
        foliageMaterials.push(mat);

        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.y = tier.y;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        treeGroup.add(mesh);
      });
    }

    // Build Star Topper
    function createStar() {
      const starGeo = new THREE.OctahedronGeometry(0.35, 0);
      starMaterial = new THREE.MeshStandardMaterial({
        color: currentPalette.star,
        emissive: currentPalette.star,
        emissiveIntensity: 0.6,
        roughness: 0.2,
        flatShading: true
      });
      const star = new THREE.Mesh(starGeo, starMaterial);
      star.position.y = 5.35;
      star.scale.set(1, 1.3, 1);
      treeGroup.add(star);
    }

    // Build Presents under the tree
    function createPresents() {
      const presentGroup = new THREE.Group();
      const colors = [0xe63946, 0x3a86ff, 0xff007f];
      
      const pos = [
        { x: 0.9, z: 0.6, size: 0.4, rot: 0.3 },
        { x: -0.8, z: 0.8, size: 0.5, rot: -0.2 },
        { x: 0.2, z: -1.0, size: 0.45, rot: 0.6 }
      ];

      pos.forEach((p, idx) => {
        const geo = new THREE.BoxGeometry(p.size, p.size, p.size);
        const mat = new THREE.MeshStandardMaterial({
          color: colors[idx % colors.length],
          roughness: 0.5,
          flatShading: true
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(p.x, p.size / 2, p.z);
        mesh.rotation.y = p.rot;
        mesh.castShadow = true;
        presentGroup.add(mesh);
      });

      treeGroup.add(presentGroup);
    }

    // Populate Ornaments Spiral Distribution
    function generateOrnaments(count) {
      // Clear existing
      while (ornamentsGroup.children.length > 0) {
        const obj = ornamentsGroup.children[0];
        ornamentsGroup.remove(obj);
      }

      const sphereGeo = new THREE.SphereGeometry(0.09, 8, 8);

      for (let i = 0; i < count; i++) {
        const t = i / count;
        const y = 1.1 + t * 3.6; // Vertical distribution along tree
        
        // Calculate max radius at this Y level
        const maxRadius = 2.0 * (1 - (y - 1.1) / 4.0);
        const radius = maxRadius * 0.92; // Slightly inset on foliage surface
        
        const angle = i * 2.4; // Golden angle spiral
        const x = Math.cos(angle) * radius;
        const z = Math.sin(angle) * radius;

        const color = currentPalette.ornaments[i % currentPalette.ornaments.length];
        const mat = new THREE.MeshStandardMaterial({
          color: color,
          roughness: 0.3,
          metalness: 0.4
        });

        const ornament = new THREE.Mesh(sphereGeo, mat);
        ornament.position.set(x, y, z);
        ornament.castShadow = true;
        ornamentsGroup.add(ornament);
      }
    }

    // --- INITIALIZE TREE ---
    createTrunk();
    createFoliage();
    createStar();
    createPresents();
    generateOrnaments(60);

    // --- CONTROLS LISTENERS ---
    const paletteSelect = document.getElementById('paletteSelect');
    const ornamentSlider = document.getElementById('ornamentSlider');
    const ornamentVal = document.getElementById('ornamentVal');
    const lightSlider = document.getElementById('lightSlider');
    const lightVal = document.getElementById('lightVal');
    const spinSlider = document.getElementById('spinSlider');
    const spinVal = document.getElementById('spinVal');

    paletteSelect.addEventListener('change', (e) => {
      currentPalette = PALETTES[e.target.value];
      
      // Update Foliage Colors
      foliageMaterials.forEach((mat, idx) => {
        mat.color.setHex(currentPalette.foliage[idx % currentPalette.foliage.length]);
      });

      // Update Trunk & Star
      trunkMaterial.color.setHex(currentPalette.trunk);
      starMaterial.color.setHex(currentPalette.star);
      starMaterial.emissive.setHex(currentPalette.star);

      // Regenerate Ornaments with new palette colors
      generateOrnaments(parseInt(ornamentSlider.value));
    });

    ornamentSlider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      ornamentVal.textContent = val;
      generateOrnaments(val);
    });

    lightSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      lightVal.textContent = val.toFixed(1);
      mainLight.intensity = val;
    });

    spinSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      spinVal.textContent = val.toFixed(1);
    });

    // --- INTERACTION (RAYCASTING) ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      // Only check raycast if click happened inside canvas
      if (mouse.x >= -1 && mouse.x <= 1 && mouse.y >= -1 && mouse.y <= 1) {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(treeGroup.children, true);

        if (intersects.length > 0) {
          const hitObj = intersects[0].object;
          // Gentle bounce/scale animation effect on hit
          const origScale = hitObj.scale.clone();
          hitObj.scale.multiplyScalar(1.3);
          setTimeout(() => {
            hitObj.scale.copy(origScale);
          }, 150);
        }
      }
    });

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const spinSpeed = parseFloat(spinSlider.value);

      // Continuous rotation
      treeGroup.rotation.y += delta * spinSpeed * 0.8;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // --- RESPONSIVE RESIZE ---
    window.addEventListener('resize', () => {
      const width = container.clientWidth;
      const height = container.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });
  </script>
</body>
</html>
