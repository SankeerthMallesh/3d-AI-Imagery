<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>WebCAD3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<style>
:root{color-scheme:dark;--bg:#1E1E24;--pn:#2A2A32;--dk:#16161a;--ac:#FF6B00;--cy:#00E5FF;--tx:#E1E1E6;--mu:#888895;--bd:#3a3a44;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font:13px Inter,system-ui,sans-serif;background:var(--dk);color:var(--tx);overflow:hidden}
#app{display:grid;grid-template:44px 1fr 28px/170px 1fr 290px;height:100%}
header{grid-column:1/-1;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:0 10px;overflow-x:auto;white-space:nowrap}
.logo{font-weight:700;color:var(--ac);margin-right:8px}
button,select,input{font:inherit;color:var(--tx)}
.b{background:var(--pn);border:1px solid var(--bd);border-radius:4px;padding:5px 9px;cursor:pointer}
.b:hover{border-color:#666}.b.on{border-color:var(--ac);background:#3a2a1e}.b.p{background:var(--ac);border-color:var(--ac);color:#fff}
#L,#Rp{background:var(--bg);padding:10px;overflow-y:auto}#L{border-right:1px solid var(--bd)}#Rp{border-left:1px solid var(--bd)}
h4{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--mu);margin:12px 0 6px}h4:first-child{margin-top:0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:5px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
#L .b{width:100%;font-size:12px;padding:6px 4px}
#vp{position:relative;min-width:0}#cv{width:100%;height:100%;display:block}
#hud{position:absolute;top:8px;left:8px;font:11px monospace;color:var(--cy);pointer-events:none;line-height:1.5}
input[type=number],select{width:100%;background:var(--dk);border:1px solid var(--bd);border-radius:3px;padding:3px 4px}
input[type=range]{width:100%;accent-color:var(--ac)}
label{display:block;font-size:11px;color:var(--mu);margin:5px 0 2px}
.row{display:flex;justify-content:space-between;padding:2px 0}.row b{color:var(--cy);font-weight:500}
.ol div{padding:4px 6px;border-radius:3px;cursor:pointer}.ol div:hover{background:var(--pn)}.ol div.s{background:#3a2a1e;color:var(--ac)}
footer{grid-column:1/-1;background:var(--bg);border-top:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 10px;font-size:11px;color:var(--mu);overflow:hidden;white-space:nowrap}
#hl{width:10px;height:10px;border-radius:50%;background:#555}
.ok{background:#2ecc71!important}.bad{background:#ff2bd6!important}
.sw{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.sw i{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid #0006;transition:transform .12s}.sw i:hover{transform:scale(1.25)}input[type=color]{width:100%;height:28px;background:none;border:1px solid var(--bd);border-radius:3px}#toast{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#000c;border:1px solid var(--ac);padding:6px 14px;border-radius:14px;opacity:0;transition:.25s;pointer-events:none}#toast.s{opacity:1}#chat{position:absolute;left:10px;bottom:40px;width:min(310px,92%);display:flex;flex-direction:column;background:#1e1e24f0;border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 24px #0008;overflow:hidden}#ch{padding:7px 10px;font-weight:600;color:var(--ac);cursor:pointer;display:flex;justify-content:space-between}#cl{overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:50px;max-height:min(340px,45vh)}.m{padding:6px 9px;border-radius:8px;font-size:12px;line-height:1.35;max-width:92%}.m.u{align-self:flex-end;background:var(--ac);color:#fff}.m.a{background:var(--pn)}#cf{display:flex;gap:4px;padding:8px;border-top:1px solid var(--bd);align-items:center}#ci{flex:1;min-width:0;background:var(--dk);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}#chips{display:flex;gap:4px;flex-wrap:wrap;padding:0 8px 6px}#chips span{font-size:11px;padding:2px 8px;border:1px solid var(--bd);border-radius:10px;cursor:pointer;color:var(--mu)}#chips span:hover{border-color:var(--ac);color:var(--tx)}#chat.c #cl,#chat.c #cf,#chat.c #chips{display:none}#lb{position:absolute;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}.fig{width:100%;display:block;border-radius:6px;cursor:zoom-in;margin:3px 0 6px}.cap{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1px}#app.hl{grid-template-columns:0 1fr 290px}#app.hr{grid-template-columns:170px 1fr 0}#app.hl.hr{grid-template-columns:0 1fr 0}#app.hl #L,#app.hr #Rp{padding:0;border:0;overflow:hidden;visibility:hidden}@media(max-width:760px){#app{grid-template:44px 1fr 200px 28px/1fr}#L{display:none}#Rp{grid-row:3;border-left:0}footer{grid-row:4}}
</style></head><body>
<div id="app">
<header><span class="logo">▲ WebCAD3D</span><button class="b" id="tL">☰ Tools</button><button class="b" id="tR">▤ Panel</button>
<button class="b" data-v="iso">Iso</button><button class="b" data-v="top">Top</button><button class="b" data-v="front">Front</button>
<button class="b" data-m="solid">Solid</button><button class="b" data-m="over">Overhang</button><button class="b" data-m="wire">Wire</button>
<button class="b" id="dup">Duplicate</button><button class="b" id="del">Delete</button><button class="b" id="undo">Undo sculpt</button>
<button class="b p" id="stl">Export STL</button></header>
<div id="L">
<h4>Tools</h4><div class="g" id="tools"></div><p style="color:var(--mu);font-size:10px;margin-top:6px">Select: drag object to move; colored dots resize.</p>
<h4>Sculpt</h4><div class="g" id="brushes"></div>
<label>Radius <span id="rv">15</span> mm</label><input type="range" id="br" min="2" max="60" value="15">
<label>Strength</label><input type="range" id="bs" min="1" max="100" value="40">
<label>Falloff</label><select id="bf"><option>smooth</option><option>linear</option><option>spherical</option><option>sharp</option></select>
<p style="color:var(--mu);font-size:10px;margin-top:6px">Sculpt: left-drag paints, right-drag orbits.</p>
<h4>Orientation</h4><div class="g"><button class="b" id="stand">⬆ Stand up</button><button class="b" id="lay">⬌ Lay flat</button><button class="b" data-r="x">↻ X 90°</button><button class="b" data-r="y">↻ Y 90°</button><button class="b" data-r="z">↻ Z 90°</button><button class="b" id="drop">⤓ Drop</button></div><label><input type="checkbox" id="snap"> Snap 5 mm</label><h4>Add primitive</h4>
<label>Size (mm)</label><input type="number" id="psz" value="40"><label>Segments</label><input type="number" id="psg" value="48" min="8" max="128">
<div class="g" style="margin-top:6px" id="prims"></div>
</div>
<div id="vp"><canvas id="cv"></canvas><div id="hud"></div><div id="toast"></div><div id="lb"></div>
<div id="chat"><div id="ch"><span>✨ AI Builder</span><span>–</span></div><div id="cl"></div><div id="chips"></div>
<div id="cf">
  <button class="b" id="chatImgBtn" title="Upload image">🖼️</button>
  <input type="file" id="chatImgInput" accept="image/*" hidden>
  <input id="ci" placeholder="Describe what to build..." autocomplete="off">
  <button class="b p" id="cs">Send</button>
</div>
</div></div>
<div id="Rp">
<h4>Transform</h4><div id="tf"></div>
<h4>Size W · H · D (mm)</h4><div class="g3" id="dm"></div>
<h4>Appearance</h4><input type="color" id="col" value="#c8cad6"><div class="sw" id="sw"></div>
<div class="g"><button class="b" id="imgNew">🖼 Image → plate</button><button class="b" id="imgSel">🖼 Image → object</button></div><input type="file" id="file" accept="image/*" hidden>
<label>Brightness</label><input type="range" id="fb" min="20" max="200" value="100"><label>Contrast</label><input type="range" id="fc" min="20" max="200" value="100"><label>Hue</label><input type="range" id="fh" min="0" max="360" value="0"><label>Tiling</label><input type="range" id="ft" min="1" max="8" value="1" step="0.5">
<div class="g"><label><input type="checkbox" id="fg"> Gray</label><label><input type="checkbox" id="fi"> Invert</label></div><button class="b" id="imgX" style="width:100%;margin-top:4px">Remove image</button>
<h4>Outliner</h4><div class="ol" id="ol"></div>
<h4>Analysis</h4><div id="an"></div>
<label>Filament</label><select id="fil"><option value="1.24">PLA 1.24</option><option value="1.04">ABS 1.04</option><option value="1.27">PETG 1.27</option><option value="1.21">TPU 1.21</option><option value="1.1">Resin 1.10</option></select>
<label>Infill %</label><input type="number" id="inf" value="20" min="1" max="100">
<label>Overhang angle <span id="av">45</span>°</label><input type="range" id="ang" min="20" max="80" value="45">
<h4>Repair</h4><div class="g"><button class="b" id="fill">Fill holes</button><button class="b" id="defects">Show defects</button></div>
<h4>Slicer</h4><label><input type="checkbox" id="sl"> Cross-section</label><input type="range" id="sh" min="0" max="100" value="100"><div class="row"><span>Layer @0.2mm</span><b id="ly">-</b></div>
</div>
<footer><span id="hl"></span><span id="hs">No mesh</span><span id="log" style="margin-left:auto"></span></footer>
</div>
<script>
const $=s=>document.querySelector(s),log=t=>{$('#log').textContent=t;const e=$('#toast');e.textContent=t;e.classList.add('s');clearTimeout(log.t);log.t=setTimeout(()=>e.classList.remove('s'),1800)};
const cv=$('#cv'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.localClippingEnabled=true;R.shadowMap.enabled=true;R.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0e0e11);
const cam=new THREE.PerspectiveCamera(45,1,1,5000);cam.position.set(130,100,170);
const orbit=new THREE.OrbitControls(cam,cv);orbit.target.set(0,20,0);orbit.update();
scene.add(new THREE.HemisphereLight(0xffffff,0x333344,.7));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(80,150,100);dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);Object.assign(dl.shadow.camera,{left:-150,right:150,top:150,bottom:-150,far:600});dl.shadow.camera.updateProjectionMatrix();scene.add(dl);
const dl2=new THREE.DirectionalLight(0x88aaff,.3);dl2.position.set(-100,50,-80);scene.add(dl2);
const grid=new THREE.GridHelper(220,22,0xFF6B00,0x33333c);scene.add(grid);
const bed=new THREE.Mesh(new THREE.PlaneGeometry(220,220).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x15151a}));bed.position.y=-.1;scene.add(bed);const shp=new THREE.Mesh(new THREE.PlaneGeometry(220,220).rotateX(-Math.PI/2),new THREE.ShadowMaterial({opacity:.35}));shp.position.y=.05;shp.receiveShadow=true;scene.add(shp);
const clip=new THREE.Plane(new THREE.Vector3(0,-1,0),1e9);
const mkStd=c=>new THREE.MeshStandardMaterial({color:c,roughness:.45,metalness:.05,clippingPlanes:[clip],side:THREE.DoubleSide});
const ovU={uCrit:{value:45},uClip:{value:1e9}};
const ov=new THREE.ShaderMaterial({uniforms:ovU,side:THREE.DoubleSide,
vertexShader:'varying vec3 vN,vW;void main(){vN=normalize(mat3(modelMatrix)*normal);vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
fragmentShader:'uniform float uCrit,uClip;varying vec3 vN,vW;void main(){if(vW.y>uClip)discard;vec3 n=normalize(vN);if(!gl_FrontFacing)n=-n;float a=degrees(asin(clamp(dot(n,vec3(0.,-1.,0.)),-1.,1.)));vec3 c=a<uCrit?vec3(.2,.8,.35):(a<uCrit+15.?vec3(.95,.8,.15):vec3(.9,.15,.15));c*=.55+.45*dot(n,normalize(vec3(.4,.8,.5)));gl_FragColor=vec4(c,1.);}'});
const cutPl=new THREE.Mesh(new THREE.PlaneGeometry(220,220).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:.12,side:THREE.DoubleSide,depthWrite:false}));cutPl.visible=false;scene.add(cutPl);
let mode='solid',tool='select',sel=null,meshes=[],cnt=0,showDef=false,undo=[],bulk=false;
const tc=new THREE.TransformControls(cam,cv);scene.add(tc);
tc.addEventListener('dragging-changed',e=>orbit.enabled=!e.value);tc.addEventListener('objectChange',()=>{fillTf();});
tc.addEventListener('mouseUp',()=>refresh());
const box=new THREE.BoxHelper(new THREE.Mesh(new THREE.BoxGeometry()),0x00e5ff);box.visible=false;scene.add(box);
function weld(g){if(g.index)g=g.toNonIndexed();const p=g.attributes.position,m=new Map(),v=[],ix=[];
for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),k=Math.round(x*1e4)+','+Math.round(y*1e4)+','+Math.round(z*1e4);let j=m.get(k);if(j===undefined){j=v.length/3;m.set(k,j);v.push(x,y,z)}ix.push(j)}
const t=[];for(let i=0;i<ix.length;i+=3){const a=ix[i],b=ix[i+1],c=ix[i+2];if(a!=b&&b!=c&&a!=c)t.push(a,b,c)}
const o=new THREE.BufferGeometry();o.setAttribute('position',new THREE.BufferAttribute(new Float32Array(v),3));o.setIndex(t);o.computeVertexNormals();return o}
function buildAdj(m){const n=m.geometry.attributes.position.count,a=Array.from({length:n},()=>new Set()),ix=m.geometry.index.array;
for(let i=0;i<ix.length;i+=3){const A=ix[i],B=ix[i+1],C=ix[i+2];a[A].add(B).add(C);a[B].add(A).add(C);a[C].add(A).add(B)}m.userData.adj=a.map(s=>[...s])}
const P={Cube:s=>new THREE.BoxGeometry(s,s,s,8,8,8),Cylinder:(s,g)=>new THREE.CylinderGeometry(s/2,s/2,s,g,12),Sphere:(s,g)=>new THREE.SphereGeometry(s/2,g,g/2),Cone:(s,g)=>new THREE.CylinderGeometry(0,s/2,s,g,12),Torus:(s,g)=>new THREE.TorusGeometry(s/2,s/6,g/2,g)};
const anims=[],bounce=t=>{const n=7.5625,d=2.75;if(t<1/d)return n*t*t;if(t<2/d)return n*(t-=1.5/d)*t+.75;if(t<2.5/d)return n*(t-=2.25/d)*t+.9375;return n*(t-=2.625/d)*t+.984375};
function addMesh(geo,name,pos,colHex){geo.computeBoundingBox();const st=mkStd(colHex||0xc8cad6),m=new THREE.Mesh(geo,mode==='over'?ov:st);m.userData.std=st;m.castShadow=true;m.name=name;buildAdj(m);
m.position.set(pos?pos.x:(cnt%3-1)*60*(cnt>0),pos?pos.y:0,pos?pos.z:0);scene.add(m);meshes.push(m);
const y=pos?pos.y:-geo.boundingBox.min.y;if(!pos)m.position.y=y+40;setSel(m);if(!bulk)refresh();
if(!pos){const t0=performance.now();anims.push(n=>{const t=Math.min(1,(n-t0)/450);m.position.y=y+40*(1-bounce(t));fillTf();if(t>=1){refresh();return true}return false})}return m}
Object.keys(P).forEach(k=>{const b=document.createElement('button');b.className='b';b.textContent=k;b.onclick=()=>{cnt++;addMesh(weld(P[k](+$('#psz').value||40,Math.max(8,+$('#psg').value||48))),k+' '+cnt)}};$('#prims').appendChild(b)});
const TOOLS=['select','translate','rotate','scale'],BR=['clay','smooth','grab','flatten','inflate'];
const sculpt=()=>BR.includes(tool);
function mkT(arr,host){arr.forEach(t=>{const b=document.createElement('button');b.className='b';b.dataset.t=t;b.textContent=t;b.onclick=()=>setTool(t);$(host).appendChild(b)})}
mkT(TOOLS,'#tools');mkT(BR,'#brushes');
function setTool(t){tool=t;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
orbit.mouseButtons={LEFT:sculpt()?-1:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:sculpt()?THREE.MOUSE.ROTATE:THREE.MOUSE.PAN};
if(['translate','rotate','scale'].includes(t)){tc.setMode(t);if(sel)tc.attach(sel)}else tc.detach();log('Tool: '+t)}
function setSel(m){sel=m;if(m&&['translate','rotate','scale'].includes(tool))tc.attach(m);else tc.detach();box.visible=!!m;if(m)box.setFromObject(m);fillTf();ol();fillApp()}
function ol(){$('#ol').innerHTML='';meshes.forEach(m=>{const d=document.createElement('div');d.textContent=m.name;if(m===sel)d.className='s';d.onclick=()=>setSel(m);$('#ol').appendChild(d)})}
const tfIn=[];['pos','rot','scl'].forEach((k,r)=>{const h=document.createElement('div');h.innerHTML='<label>'+['Position (mm)','Rotation (°)','Scale'][r]+'</label>';const g=document.createElement('div');g.className='g3';['x','y','z'].forEach(a=>{const i=document.createElement('input');i.type='number';i.step=r==2?.05:1;i.oninput=()=>{if(!sel||i.value==='')return;const v=+i.value;if(r==0)sel.position[a]=v;else if(r==1)sel.rotation[a]=v*Math.PI/180;else sel.scale[a]=v||.01;refresh()};tfIn.push([r,a,i]);g.appendChild(i)});h.appendChild(g);$('#tf').appendChild(h)});
function fillTf(){if(!sel)return;tfIn.forEach(([r,a,i])=>{if(document.activeElement===i)return;const v=r==0?sel.position[a]:r==1?sel.rotation[a]*180/Math.PI:sel.scale[a];i.value=+v.toFixed(2)});dmIn.forEach(([a,i])=>{if(document.activeElement!==i)i.value=+gs(sel)[a].toFixed(2)})}
const DEN=()=>+$('#fil').value;
function analyze(){let vol=0,area=0,open=0;const bb=new THREE.Box3();const a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3(),t=new THREE.Vector3();
meshes.forEach(m=>{m.updateMatrixWorld(true);const p=m.geometry.attributes.position,ix=m.geometry.index.array,e=new Map();
m.children.filter(x=>x.userData.def).forEach(x=>{m.remove(x);x.geometry.dispose()});
for(let i=0;i<ix.length;i+=3){a.fromBufferAttribute(p,ix[i]).applyMatrix4(m.matrixWorld);b.fromBufferAttribute(p,ix[i+1]).applyMatrix4(m.matrixWorld);c.fromBufferAttribute(p,ix[i+2]).applyMatrix4(m.matrixWorld);
vol+=a.dot(t.copy(b).cross(c))/6;area+=t.copy(b).sub(a).cross(c.clone().sub(a)).length()/2;
for(let k=0;k<3;k++){const u=ix[i+k],w=ix[i+(k+1)%3],key=u<w?u+'_'+w:w+'_'+u;const o=e.get(key);if(o)o.n++;else e.set(key,{u,w,n:1})}}
const L=[];e.forEach(o=>{if(o.n!==2){open++;L.push(p.getX(o.u),p.getY(o.u),p.getZ(o.u),p.getX(o.w),p.getY(o.w),p.getZ(o.w))}});
if(L.length){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(L,3));const ln=new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0xff2bd6,depthTest:false}));ln.userData.def=1;ln.renderOrder=9;ln.visible=showDef;m.add(ln)}
bb.union(new THREE.Box3().setFromObject(m))});
return{vol:Math.abs(vol)/1000,area:area/100,open,bb}}
function refresh(){if(sel)box.setFromObject(sel);const r=analyze(),s=new THREE.Vector3();if(meshes.length)r.bb.getSize(s);
const w=r.vol*DEN()*(+$('#inf').value||100)/100;
$('#an').innerHTML=[['Bounding box',meshes.length?s.x.toFixed(1)+' × '+s.y.toFixed(1)+' × '+s.z.toFixed(1)+' mm':'-'],['Volume',r.vol.toFixed(2)+' cm³'],['Surface area',r.area.toFixed(2)+' cm²'],['Est. weight',w.toFixed(1)+' g'],['Open edges',r.open]].map(x=>'<div class="row"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');
$('#hl').className=meshes.length?(r.open?'bad':'ok'):'';$('#hs').textContent=meshes.length?(r.open?'Non-manifold: '+r.open+' open edges':'Watertight'):'No mesh';
const H=meshes.length?r.bb.max.y:0;$('#ly').textContent=H?Math.max(1,Math.round(H*(+$('#sh').value/100)/.2))+' / '+Math.round(H/.2):'-';applySlice();fillTf()}
function applySlice(){let H=0;meshes.forEach(m=>H=Math.max(H,new THREE.Box3().setFromObject(m).max.y));const on=$('#sl').checked,y=on?H*(+$('#sh').value/100):1e9;clip.constant=y;ovU.uClip.value=y;cutPl.visible=on;cutPl.position.y=on?y:0}
function setMode(m){mode=m;meshes.forEach(x=>{x.userData.std.wireframe=m==='wire';x.material=m==='over'?ov:x.userData.std});document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m))}
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setMode(b.dataset.m));setMode('solid');
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const d={iso:[130,100,170],top:[0,260,.1],front:[0,40,260]}[b.dataset.v];cam.position.set(...d);orbit.target.set(0,20,0);orbit.update()});
$('#ang').oninput=e=>{ovU.uCrit.value=+e.target.value;$('#av').textContent=e.target.value};
$('#br').oninput=e=>$('#rv').textContent=e.target.value;

$('#fill').onclick=()=>{if(!sel)return;const g=sel.geometry,p=g.attributes.position,ix=Array.from(g.index.array),c=new Map(),ed=[];
for(let i=0;i<ix.length;i+=3)for(let k=0;k<3;k++){const a=ix[i+k],b=ix[i+(k+1)%3],key=a<b?a+'_'+b:b+'_'+a;c.set(key,(c.get(key)||0)+1);ed.push([a,b,key])}

nx.forEach((_,s)=>{if(seen.has(s))return;const L=[];let cur=s;while(!seen.has(cur)&&nx.has(cur)){seen.add(cur);L.push(cur);cur=nx.get(cur)}if(L.length<3)return;
let x=0,y=0,z=0;L.forEach(i=>{x+=v[i*3];y+=v[i*3+1];z+=v[i*3+2]});const ci=v.length/3;v.push(x/L.length,y/L.length,z/L.length);

const ray=new THREE.Raycaster(),nd=new THREE.Vector2();

function region(h){const g=sel.geometry,p=g.attributes.position,c=sel.worldToLocal(h.point.clone()),r=+$('#br').value/sel.scale.x,f=fo[$('#bf').value],o=[],v=new THREE.Vector3();
for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const d=v.distanceTo(c);if(d<r)o.push({i,w:f(1-d/r)})}return{o,c,r}}
function brush(h,inv){const g=sel.geometry,p=g.attributes.position,nrm=g.attributes.normal,{o,c,r}=region(h),s=(+$('#bs').value/100)*(inv?-1:1),k=r*.06*s,v=new THREE.Vector3(),n=new THREE.Vector3();if(!o.length)return;
if(tool==='clay'||tool==='flatten'){o.forEach(q=>n.add(v.fromBufferAttribute(nrm,q.i)));n.normalize()}
if(tool==='clay')o.forEach(q=>{v.fromBufferAttribute(p,q.i).addScaledVector(n,k*q.w);p.setXYZ(q.i,v.x,v.y,v.z)});
else if(tool==='inflate')o.forEach(q=>{n.fromBufferAttribute(nrm,q.i);v.fromBufferAttribute(p,q.i).addScaledVector(n,k*q.w);p.setXYZ(q.i,v.x,v.y,v.z)});
else if(tool==='smooth'){const src=p.array.slice(),adj=sel.userData.adj;o.forEach(q=>{const A=adj[q.i];if(!A.length)return;let x=0,y=0,z=0;A.forEach(j=>{x+=src[j*3];y+=src[j*3+1];z+=src[j*3+2]});x/=A.length;y/=A.length;z/=A.length;const t=Math.min(1,Math.abs(s)*q.w*.6);p.setXYZ(q.i,src[q.i*3]+(x-src[q.i*3])*t,src[q.i*3+1]+(y-src[q.i*3+1])*t,src[q.i*3+2]+(z-src[q.i*3+2])*t)})}
else if(tool==='flatten'){const ct=new THREE.Vector3();o.forEach(q=>ct.add(v.fromBufferAttribute(p,q.i)));ct.divideScalar(o.length);o.forEach(q=>{v.fromBufferAttribute(p,q.i);const d=v.clone().sub(ct).dot(n)*Math.min(1,Math.abs(s)*q.w);p.setXYZ(q.i,v.x-n.x*d,v.y-n.y*d,v.z-n.z*d)})}
upd()}

if(sculpt()&&sel){const h=pick([sel],e);if(!h)return;undo.push({m:sel,p:sel.geometry.attributes.position.array.slice()});if(undo.length>20)undo.shift();cv.setPointerCapture(e.pointerId);
if(tool==='grab'){const {o}=region(h),pl=new THREE.Plane().setFromNormalAndCoplanarPoint(cam.getWorldDirection(new THREE.Vector3()),h.point),p=sel.geometry.attributes.position;stroke={o:o.map(q=>({...q,p0:new THREE.Vector3().fromBufferAttribute(p,q.i)})),pl,s:sel.worldToLocal(h.point.clone())}}else{stroke={};brush(h,e.shiftKey)}}});

else{const h=pick([sel],e);if(h)brush(h,e.shiftKey)}});

/* Smart Procedural AI Generator Engine */
function clearAll(){meshes.slice().forEach(m=>{scene.remove(m);if(m.geometry)m.geometry.dispose()});meshes=[];sel=null;box.visible=false}

function buildDetailedChristmasTree(){
  clearAll();bulk=true;
  
  // 1. Trunk
  const trunkGeo = weld(new THREE.CylinderGeometry(5,5,20,16));
  const trunk = addMesh(trunkGeo, "Tree Trunk", new THREE.Vector3(0, 10, 0), 0x5c4033);

  // 2. Multi-tier Foliage Segments
  const foliageTiers = [
    { radius: 25, height: 25, yPos: 28, color: 0x0f5257, name: "Foliage Tier 1" },
    { radius: 20, height: 22, yPos: 42, color: 0x0b6623, name: "Foliage Tier 2" },
    { radius: 15, height: 18, yPos: 54, color: 0x299617, name: "Foliage Tier 3" },
    { radius: 10, height: 14, yPos: 64, color: 0x3bb143, name: "Foliage Tier 4" }
  ];

  foliageTiers.forEach(tier => {
    const coneGeo = weld(new THREE.ConeGeometry(tier.radius, tier.height, 16));
    addMesh(coneGeo, tier.name, new THREE.Vector3(0, tier.yPos, 0), tier.color);
  });

  // 3. Gold Star Apex
  const starGeo = weld(new THREE.DodecahedronGeometry(4, 0));
  addMesh(starGeo, "Star Topper", new THREE.Vector3(0, 74, 0), 0xffd700);

  // 4. Spiral Ornaments/Baubles
  const ornamentColors = [0xff0000, 0x00e5ff, 0xffff00, 0xff007f];
  const totalOrnaments = 16;
  for (let i = 0; i < totalOrnaments; i++) {
    const progress = i / totalOrnaments;
    const yVal = 20 + progress * 45;
    const radiusAtHeight = (1 - (yVal - 18) / 52) * 22;
    const angle = i * 2.4;

    const xVal = Math.cos(angle) * radiusAtHeight;
    const zVal = Math.sin(angle) * radiusAtHeight;

    const orbGeo = weld(new THREE.SphereGeometry(2, 10, 10));
    addMesh(orbGeo, `Ornament ${i + 1}`, new THREE.Vector3(xVal, yVal, zVal), ornamentColors[i % ornamentColors.length]);
  }

  bulk = false;
  setSel(trunk);
  refresh();
  log("Built Detailed Multi-Tier Christmas Tree");
}

function buildSnowman(){
  clearAll();bulk=true;
  const b1=addMesh(weld(new THREE.SphereGeometry(22,24,24)),"Base Ball",new THREE.Vector3(0,22,0),0xf0f4f8);
  const b2=addMesh(weld(new THREE.SphereGeometry(16,24,24)),"Mid Ball",new THREE.Vector3(0,52,0),0xf0f4f8);
  const b3=addMesh(weld(new THREE.SphereGeometry(11,24,24)),"Head Ball",new THREE.Vector3(0,74,0),0xf0f4f8);
  const nose=addMesh(weld(new THREE.ConeGeometry(2.5,12,12)),"Carrot Nose",new THREE.Vector3(0,74,12),0xff6b00);
  nose.rotation.x=Math.PI/2;
  const hat=addMesh(weld(new THREE.CylinderGeometry(12,12,2,16)),"Hat Brim",new THREE.Vector3(0,83,0),0x111111);
  const hatTop=addMesh(weld(new THREE.CylinderGeometry(8,8,12,16)),"Hat Top",new THREE.Vector3(0,90,0),0x111111);
  bulk=false;setSel(b1);refresh();log("Built Snowman");
}

function buildHouse(){
  clearAll();bulk=true;
  const body=addMesh(weld(new THREE.BoxGeometry(40,30,40)),"House Base",new THREE.Vector3(0,15,0),0xdfd3c3);
  const roof=addMesh(weld(new THREE.ConeGeometry(34,22,4)),"Roof",new THREE.Vector3(0,41,0),0xa03c3c);
  roof.rotation.y=Math.PI/4;
  const door=addMesh(weld(new THREE.BoxGeometry(8,16,2)),"Door",new THREE.Vector3(0,8,20),0x5c4033);
  bulk=false;setSel(body);refresh();log("Built House");
}

function processAIChat(prompt){
  const p=prompt.toLowerCase();
  if(p.includes('tree')||p.includes('christmas')) buildDetailedChristmasTree();
  else if(p.includes('snowman')) buildSnowman();
  else if(p.includes('house')||p.includes('building')) buildHouse();
  else {
    clearAll();
    const m=addMesh(weld(new THREE.BoxGeometry(30,30,30)),"AI Object",new THREE.Vector3(0,15,0),0x00e5ff);
    refresh();log("Built Custom Model");
  }
}

function addMessage(txt,type){
  const cl=$('#cl'),d=document.createElement('div');
  d.className='m '+(type==='u'?'u':'a');d.textContent=txt;
  cl.appendChild(d);cl.scrollTop=cl.scrollHeight;
}

$('#cs').onclick=()=>{
  const inp=$('#ci'),val=inp.value.trim();if(!val)return;
  addMessage(val,'u');inp.value='';
  setTimeout(()=>{
    processAIChat(val);
    addMessage(`Generated 3D construct for "${val}"`,'a');
  },300);
};
